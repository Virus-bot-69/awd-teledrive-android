name: Build My Personal Drive APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply v2.0.6 source update
        run: |
          test -s my-personal-drive-update-v2.0.6.zip
          unzip -oq my-personal-drive-update-v2.0.6.zip -d .
          grep -n 'versionName = "2.0.6"' app/build.gradle.kts
          grep -n 'versionCode = 14' app/build.gradle.kts
          grep -n 'MANAGE_EXTERNAL_STORAGE' app/src/main/AndroidManifest.xml
          grep -n '^import com.awd.teledrive.R$' app/src/main/java/com/awd/teledrive/ui/screens/accounts/AccountsScreen.kt

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMAN="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMAN" --licenses > /dev/null 2>&1 || true
          "$SDKMAN" --install "platform-tools" "platforms;android-37.0" "build-tools;37.0.0" || \
          "$SDKMAN" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          ls "$ANDROID_HOME/platforms" || true

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-personal-drive-v2.0.6-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
